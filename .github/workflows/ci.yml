name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37 (material3 1.5 needs compileSdk 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Unit tests, lint, debug build
        run: ./gradlew --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Reference stats match fixtures (Python)
        run: |
          F=app/src/test/resources/fixtures
          for y in 2025 2026; do
            python3 tools/untis_probe.py stats $F/timetable_$y.json $F/absences_$y.json $F/userdata.json > /tmp/s.json
            diff <(python3 -m json.tool --sort-keys /tmp/s.json) <(python3 -m json.tool --sort-keys $F/stats_expected_$y.json)
          done
